# Builds the Android app (APK) for family sharing — no Android Studio needed.
#
# How to release a new version:   Actions tab → "Build APK" → Run workflow
#   (or push a tag like v1.1:  git tag v1.1 && git push --tags)
# Result: a GitHub Release with  Kharcha.apk  attached. Share that download link on WhatsApp.
#
# IMPORTANT — keep the same signing key forever, otherwise family members cannot install updates
# over the old app (Android shows "App not installed") and would have to uninstall = lose data.
# Create the key once with scripts/make-keystore.sh and add these repo secrets:
#   KEYSTORE_B64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD
name: Build APK
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 21 }
      - name: Android SDK (already installed on GitHub runners)
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKM" ] || SDKM=$(ls -d $ANDROID_HOME/cmdline-tools/*/bin/sdkmanager | tail -1)
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "platforms;android-36" "build-tools;36.0.0" > /dev/null || echo "Gradle will download missing parts itself"

      - name: Find the app files
        run: |
          # Works even if the files were uploaded inside an extra folder (e.g. kharcha/)
          if [ ! -f package.json ]; then
            f=$(find . -maxdepth 4 -name package.json -not -path "*/node_modules/*" | head -1)
            if [ -z "$f" ]; then echo "::error::package.json not found. Upload the CONTENTS of the kharcha folder (src, public, package.json...)."; ls -la; exit 1; fi
            d=$(dirname "$f"); echo "App files found in $d - moving them up"
            shopt -s dotglob; cp -r "$d"/* . 
          fi
          ls

      - name: Check all app files were uploaded
        run: |
          miss=0
          for f in index.html vite.config.js capacitor.config.json src/main.jsx src/App.jsx src/styles.css \
                   src/components/Charts.jsx src/components/ui.jsx \
                   src/screens/Login.jsx src/screens/Home.jsx src/screens/Transactions.jsx src/screens/AddExpense.jsx \
                   src/screens/SmsImport.jsx src/screens/Budget.jsx src/screens/Loans.jsx src/screens/Udhar.jsx \
                   src/screens/Trends.jsx src/screens/Settings.jsx scripts/setup-android.mjs; do
            [ -f "$f" ] || { echo "::error::MISSING FILE: $f  -> upload it from the unzipped kharcha folder (same place)"; miss=1; }
          done
          [ $miss = 0 ] && echo "All files present" || exit 1

      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build

      - name: Add Android project
        run: npx cap add android && node scripts/setup-android.mjs && npx cap sync android
      - name: App icon
        run: npx @capacitor/assets generate --android --iconBackgroundColor '#0f766e' --splashBackgroundColor '#0f766e' || true

      - name: Signing key
        env:
          KS: ${{ secrets.KEYSTORE_B64 }}
          SP: ${{ secrets.KEYSTORE_PASSWORD || secrets.KEY_PASSWORD }}
          KA: ${{ secrets.KEY_ALIAS || 'kharcha' }}
        run: |
          [ -z "$KS" ] && { echo "::error::Secret KEYSTORE_B64 is missing (Settings > Secrets and variables > Actions)"; exit 1; }
          [ -z "$SP" ] && { echo "::error::Secret KEYSTORE_PASSWORD is missing (Settings > Secrets and variables > Actions)"; exit 1; }
          echo "$KS" | tr -d ' \r\n' | base64 -d > "$RUNNER_TEMP/upload.jks" || { echo "::error::KEYSTORE_B64 is not valid - paste the whole long line again, nothing else"; exit 1; }
          keytool -list -keystore "$RUNNER_TEMP/upload.jks" -storepass "$SP" -alias "$KA" > /dev/null \
            || { echo "::error::Key check failed: KEYSTORE_PASSWORD or KEY_ALIAS secret value is wrong. Re-paste them from github-secrets.txt"; exit 1; }
          echo "Signing key OK"

      - name: Build signed APK
        working-directory: android
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/upload.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'kharcha' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || secrets.KEYSTORE_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.0.${{ github.run_number }}
        run: chmod +x gradlew && ./gradlew assembleRelease --stacktrace && cp app/build/outputs/apk/release/app-release.apk ../Kharcha.apk

      - name: Publish release with the APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('v1.0.{0}', github.run_number) }}
          name: Kharcha 1.0.${{ github.run_number }}
          body: |
            Install: open this page on your Android phone → tap **Kharcha.apk** → Open → allow "Install unknown apps" for your browser/WhatsApp → Install.
            Updating: install the new APK over the old one. Your data stays on your phone.
          files: Kharcha.apk
          make_latest: true
