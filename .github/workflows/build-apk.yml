# Builds the Android app (APK) for family sharing — no Android Studio needed.
#
# How to release a new version:   Actions tab → "Build APK" → Run workflow
#   (or push a tag like v1.1:  git tag v1.1 && git push --tags)
# Result: a GitHub Release with  Kharcha.apk  attached. Share that download link on WhatsApp.
#
# IMPORTANT — keep the same signing key forever, otherwise family members cannot install updates
# over the old app (Android shows "App not installed") and would have to uninstall = lose data.
# Create the key once with scripts/make-keystore.sh and add these repo secrets:
#   KEYSTORE_B64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD
name: Build APK
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: android-actions/setup-android@v3

      - run: npm install
      - run: npm test
      - run: npm run build

      - name: Add Android project
        run: npx cap add android && node scripts/setup-android.mjs && npx cap sync android
      - name: App icon
        run: npx @capacitor/assets generate --android --iconBackgroundColor '#0f766e' --splashBackgroundColor '#0f766e' || true

      - name: Signing key
        env: { KS: '${{ secrets.KEYSTORE_B64 }}' }
        run: |
          if [ -z "$KS" ]; then echo "::error::KEYSTORE_B64 secret missing. Run scripts/make-keystore.sh once and add the 4 secrets."; exit 1; fi
          echo "$KS" | base64 -d > "$RUNNER_TEMP/upload.jks"

      - name: Build signed APK
        working-directory: android
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/upload.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.0.${{ github.run_number }}
        run: chmod +x gradlew && ./gradlew assembleRelease && cp app/build/outputs/apk/release/app-release.apk ../Kharcha.apk

      - name: Publish release with the APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('v1.0.{0}', github.run_number) }}
          name: Kharcha 1.0.${{ github.run_number }}
          body: |
            Install: open this page on your Android phone → tap **Kharcha.apk** → Open → allow "Install unknown apps" for your browser/WhatsApp → Install.
            Updating: install the new APK over the old one. Your data stays on your phone.
          files: Kharcha.apk
          make_latest: true
